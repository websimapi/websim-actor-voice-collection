<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actor Voice Collection</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .voices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .voice-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .voice-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        
        .voice-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        .voice-script {
            font-style: italic;
            margin-bottom: 20px;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .play-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1rem;
        }
        
        .play-button:hover {
            background: linear-gradient(45deg, #ee5a24, #ff6b6b);
            transform: scale(1.05);
        }
        
        .play-button:active {
            transform: scale(0.98);
        }
        
        .playing {
            background: linear-gradient(45deg, #2ecc71, #27ae60) !important;
        }
        
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .control-button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        
        .control-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Actor Voice Collection</h1>
        
        <div class="controls">
            <button class="control-button" onclick="stopAll()">Stop All</button>
            <button class="control-button" onclick="playRandom()">Play Random</button>
        </div>
        
        <div class="voices-grid" id="voicesGrid">
            <!-- Voice cards will be generated by JavaScript -->
        </div>
    </div>

    <script>
        const voices = [
            {
                title: "Shakespearean Actor",
                script: "To be or not to be, that is the question! Whether 'tis nobler in the mind to suffer the slings and arrows of outrageous fortune...",
                file: "shakespearean_actor.mp3"
            },
            {
                title: "Action Hero",
                script: "I'll be back. And when I return, there's gonna be hell to pay. Nobody messes with my family and gets away with it!",
                file: "action_hero.mp3"
            },
            {
                title: "Mysterious Narrator",
                script: "In the shadows of the night, where secrets whisper and truth hides... one man will discover that reality is far stranger than fiction.",
                file: "mysterious_narrator.mp3"
            },
            {
                title: "Comedy Character",
                script: "Well, that's just fantastic! Another brilliant plan gone completely sideways. What could possibly go wrong next? Don't answer that!",
                file: "comedy_character.mp3"
            },
            {
                title: "Sinister Villain",
                script: "You fools think you can stop me? I've been planning this for years... and now, finally, my moment of triumph has arrived!",
                file: "sinister_villain.mp3"
            },
            {
                title: "News Anchor",
                script: "Good evening, I'm reporting live from downtown where breaking news continues to unfold. We'll have more updates as this story develops.",
                file: "news_anchor.mp3"
            },
            {
                title: "Southern Gentleman",
                script: "Well, I do declare! That's the finest hospitality I've encountered in all my years. Y'all sure know how to treat a gentleman right proper.",
                file: "southern_gentleman.mp3"
            },
            {
                title: "British Aristocrat",
                script: "I say, old chap, that simply won't do at all! One must maintain proper standards, don't you know. Quite improper, really.",
                file: "british_aristocrat.mp3"
            },
            {
                title: "Sci-Fi Robot",
                script: "System analysis complete. Human behavior patterns remain... illogical. Recalibrating social interaction protocols for optimal efficiency.",
                file: "scifi_robot.mp3"
            },
            {
                title: "Fantasy Wizard",
                script: "By the ancient powers that flow through these mystical realms, I summon thee! The magic of ages past shall guide us to victory!",
                file: "fantasy_wizard.mp3"
            }
        ];

        let currentAudio = null;
        let currentButton = null;

        function createVoiceCard(voice) {
            return `
                <div class="voice-card">
                    <div class="voice-title">${voice.title}</div>
                    <div class="voice-script">"${voice.script}"</div>
                    <button class="play-button" onclick="playVoice('${voice.file}', this)">
                        ▶ Play Voice
                    </button>
                </div>
            `;
        }

        function playVoice(filename, button) {
            // Stop current audio if playing
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.innerHTML = '▶ Play Voice';
                }
            }

            // If clicking the same button, just stop
            if (currentButton === button) {
                currentAudio = null;
                currentButton = null;
                return;
            }

            // Play new audio
            currentAudio = new Audio(filename);
            currentButton = button;
            
            button.classList.add('playing');
            button.innerHTML = '⏸ Playing...';
            
            currentAudio.play();
            
            currentAudio.onended = function() {
                button.classList.remove('playing');
                button.innerHTML = '▶ Play Voice';
                currentAudio = null;
                currentButton = null;
            };
        }

        function stopAll() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.innerHTML = '▶ Play Voice';
                }
                currentAudio = null;
                currentButton = null;
            }
        }

        function playRandom() {
            const randomIndex = Math.floor(Math.random() * voices.length);
            const buttons = document.querySelectorAll('.play-button');
            playVoice(voices[randomIndex].file, buttons[randomIndex]);
        }

        // Initialize the page
        document.getElementById('voicesGrid').innerHTML = voices.map(createVoiceCard).join('');
    </script>

</body>
</html>
