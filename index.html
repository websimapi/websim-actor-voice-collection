<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actor Voice Collection</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .tts-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .tts-container h2 {
            font-size: 2rem;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .tts-container p {
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .tts-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tts-select, .tts-textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            font-family: 'Arial', sans-serif;
            box-sizing: border-box;
        }

        .tts-select {
            cursor: pointer;
        }

        .tts-select option {
            background: #3c2a4d;
            color: white;
        }

        .tts-textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .tts-textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .tts-generate-button {
            width: 100%;
            padding: 15px 20px !important;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        }

        .tts-generate-button:hover {
            background: linear-gradient(45deg, #ee5a24, #ff6b6b) !important;
        }
        
        .tts-generate-button:disabled {
            background: #999 !important;
            cursor: not-allowed;
            opacity: 0.7;
            transform: none !important;
        }

        .tts-output {
            margin-top: 25px;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tts-output audio {
            width: 100%;
            max-width: 600px;
        }
        
        .voices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .voice-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .voice-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        
        .voice-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        .voice-script {
            font-style: italic;
            margin-bottom: 20px;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .play-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1rem;
        }
        
        .play-button:hover {
            background: linear-gradient(45deg, #ee5a24, #ff6b6b);
            transform: scale(1.05);
        }
        
        .play-button:active {
            transform: scale(0.98);
        }
        
        .playing {
            background: linear-gradient(45deg, #2ecc71, #27ae60) !important;
        }
        
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .control-button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        
        .control-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Actor Voice Collection</h1>

        <div class="tts-container">
            <h2>🎙️ Advanced TTS Voice Cloning</h2>
            <p>Select a voice actor, type your script, and generate a new voice clip!</p>
            <div class="tts-controls">
                <select id="voice-selector" class="tts-select"></select>
                <textarea id="tts-input" class="tts-textarea" placeholder="Enter your script here..."></textarea>
                <button id="generate-tts-button" class="control-button tts-generate-button">Generate Voice</button>
            </div>
            <div id="tts-output" class="tts-output"></div>
        </div>
        
        <div class="controls">
            <button class="control-button" onclick="stopAll()">Stop All</button>
            <button class="control-button" onclick="playRandom()">Play Random</button>
        </div>
        
        <div class="voices-grid" id="voicesGrid">
            <!-- Voice cards will be generated by JavaScript -->
        </div>
    </div>

    <script>
        const voices = [
            {
                title: "Shakespearean Actor",
                script: "To be or not to be, that is the question! Whether 'tis nobler in the mind to suffer the slings and arrows of outrageous fortune...",
                file: "shakespearean_actor.mp3"
            },
            {
                title: "Action Hero",
                script: "I'll be back. And when I return, there's gonna be hell to pay. Nobody messes with my family and gets away with it!",
                file: "action_hero.mp3"
            },
            {
                title: "Mysterious Narrator",
                script: "In the shadows of the night, where secrets whisper and truth hides... one man will discover that reality is far stranger than fiction.",
                file: "mysterious_narrator.mp3"
            },
            {
                title: "Comedy Character",
                script: "Well, that's just fantastic! Another brilliant plan gone completely sideways. What could possibly go wrong next? Don't answer that!",
                file: "comedy_character.mp3"
            },
            {
                title: "Sinister Villain",
                script: "You fools think you can stop me? I've been planning this for years... and now, finally, my moment of triumph has arrived!",
                file: "sinister_villain.mp3"
            },
            {
                title: "News Anchor",
                script: "Good evening, I'm reporting live from downtown where breaking news continues to unfold. We'll have more updates as this story develops.",
                file: "news_anchor.mp3"
            },
            {
                title: "Southern Gentleman",
                script: "Well, I do declare! That's the finest hospitality I've encountered in all my years. Y'all sure know how to treat a gentleman right proper.",
                file: "southern_gentleman.mp3"
            },
            {
                title: "British Aristocrat",
                script: "I say, old chap, that simply won't do at all! One must maintain proper standards, don't you know. Quite improper, really.",
                file: "british_aristocrat.mp3"
            },
            {
                title: "Sci-Fi Robot",
                script: "System analysis complete. Human behavior patterns remain... illogical. Recalibrating social interaction protocols for optimal efficiency.",
                file: "scifi_robot.mp3"
            },
            {
                title: "Fantasy Wizard",
                script: "By the ancient powers that flow through these mystical realms, I summon thee! The magic of ages past shall guide us to victory!",
                file: "fantasy_wizard.mp3"
            }
        ];

        let currentAudio = null;
        let currentButton = null;

        function createVoiceCard(voice) {
            return `
                <div class="voice-card">
                    <div class="voice-title">${voice.title}</div>
                    <div class="voice-script">"${voice.script}"</div>
                    <button class="play-button" onclick="playVoice('${voice.file}', this)">
                        ▶ Play Voice
                    </button>
                </div>
            `;
        }

        function playVoice(filename, button) {
            // Stop current audio if playing
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.innerHTML = '▶ Play Voice';
                }
            }

            // If clicking the same button, just stop
            if (currentButton === button) {
                currentAudio = null;
                currentButton = null;
                return;
            }

            // Play new audio
            currentAudio = new Audio(filename);
            currentButton = button;
            
            button.classList.add('playing');
            button.innerHTML = '⏸ Playing...';
            
            currentAudio.play();
            
            currentAudio.onended = function() {
                button.classList.remove('playing');
                button.innerHTML = '▶ Play Voice';
                currentAudio = null;
                currentButton = null;
            };
        }

        function stopAll() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.innerHTML = '▶ Play Voice';
                }
                currentAudio = null;
                currentButton = null;
            }
        }

        function playRandom() {
            const randomIndex = Math.floor(Math.random() * voices.length);
            const buttons = document.querySelectorAll('.play-button');
            // Ensure the button exists before trying to click it
            if(buttons[randomIndex]) {
                buttons[randomIndex].click();
            }
        }

        function populateVoiceSelector() {
            const selector = document.getElementById('voice-selector');
            voices.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.file;
                option.textContent = voice.title;
                selector.appendChild(option);
            });
        }
        
        async function handleGenerateTTS() {
            const selector = document.getElementById('voice-selector');
            const input = document.getElementById('tts-input');
            const button = document.getElementById('generate-tts-button');
            const outputContainer = document.getElementById('tts-output');

            const voiceSample = selector.value;
            const textToSpeak = input.value.trim();

            if (!textToSpeak) {
                alert("Please enter some text to generate audio.");
                return;
            }

            button.disabled = true;
            button.textContent = 'Generating...';
            outputContainer.innerHTML = '<p>Cloning voice and generating audio, please wait...</p>';
            
            // Stop any currently playing sample audio to prevent resource conflicts
            stopAll();

            try {
                // The websim.textToSpeech function with voice_sample expects a URL string.
                // The voiceSample variable already holds the relative path to the audio file.
                const result = await websim.textToSpeech({
                    text: textToSpeak,
                    voice_sample: voiceSample,
                });

                outputContainer.innerHTML = ''; // Clear loading message
                const audioEl = document.createElement('audio');
                audioEl.controls = true;
                audioEl.src = result.url;
                audioEl.autoplay = true;
                outputContainer.appendChild(audioEl);

            } catch (error) {
                console.error("TTS Generation Error:", error);
                outputContainer.innerHTML = `<p style="color: #ff6b6b;">Sorry, there was an error generating the voice. Please try again.</p>`;
            } finally {
                button.disabled = false;
                button.textContent = 'Generate Voice';
            }
        }

        function init() {
            document.getElementById('voicesGrid').innerHTML = voices.map(createVoiceCard).join('');
            populateVoiceSelector();
            document.getElementById('generate-tts-button').addEventListener('click', handleGenerateTTS);
        }

        // Initialize the page
        init();
    </script>

</body>
</html>
