<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceForge - Actor Voice Cloning Platform</title>
    <script type="importmap">
    {
      "imports": {
        "@ffmpeg/ffmpeg": "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/ffmpeg.js",
        "@ffmpeg/util": "https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js"
      }
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #6366f1;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            text-align: center;
            z-index: 2;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(45deg, #ffffff, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInUp 1s ease;
        }

        .hero p {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            opacity: 0.8;
            animation: fadeInUp 1s ease 0.2s both;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 1s ease 0.4s both;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        /* Voice Library Section */
        .voice-section {
            padding: 6rem 0;
            background: rgba(255, 255, 255, 0.02);
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            background: linear-gradient(45deg, #ffffff, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .voices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .voice-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .voice-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .voice-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffd700;
        }

        .voice-script {
            font-style: italic;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        .voice-controls {
            display: flex;
            gap: 0.5rem;
        }

        .play-button, .use-button {
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .play-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            flex: 1;
        }

        .use-button {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            flex: 1;
        }

        .play-button:hover, .use-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .playing {
            background: linear-gradient(45deg, #2ecc71, #27ae60) !important;
        }

        /* TTS Demo Section */
        .tts-demo {
            padding: 6rem 0;
        }

        .demo-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .demo-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 1rem;
            color: white;
            font-size: 1rem;
            margin-bottom: 1rem;
            resize: vertical;
            min-height: 120px;
        }

        .demo-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .demo-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .voice-search-container {
            position: relative;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 0.75rem;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            flex: 1;
            min-width: 200px;
        }

        .voice-search-input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 1rem;
        }

        .voice-search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .voice-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-top: none;
            border-radius: 0 0 10px 10px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .voice-option {
            padding: 0.75rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: background 0.2s ease;
        }

        .voice-option:hover,
        .voice-option.highlighted {
            background: rgba(99, 102, 241, 0.3);
        }

        .voice-option:last-child {
            border-bottom: none;
        }

        .generate-btn {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .control-button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        
        .control-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .floating-element {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Loading states */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid #6366f1;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .nav-links {
                display: none;
            }
            
            .demo-container {
                padding: 2rem;
            }

            .demo-controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <div class="logo">VoiceForge</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#voices">Voices</a></li>
                <li><a href="#demo">Demo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <div class="floating-elements"></div>
            <div class="container">
                <div class="hero-content">
                    <h1>Professional Voice Cloning</h1>
                    <p>Choose from our collection of professional actor voices and generate speech with cutting-edge AI technology.</p>
                    <a href="#demo" class="cta-button">Try Voice Cloning</a>
                </div>
            </div>
        </section>

        <section id="voices" class="voice-section">
            <div class="container">
                <h2 class="section-title">🎭 Professional Voice Collection</h2>
                
                <div class="controls">
                    <button class="control-button" onclick="stopAll()">Stop All</button>
                    <button class="control-button" onclick="playRandom()">Play Random</button>
                </div>
                
                <div class="voices-grid" id="voicesGrid">
                    <!-- Voice cards will be generated by JavaScript -->
                </div>
            </div>
        </section>

        <section id="demo" class="tts-demo">
            <div class="container">
                <h2 class="section-title">Try Text-to-Speech Cloning</h2>
                <div class="demo-container">
                    <textarea id="ttsText" class="demo-input" placeholder="Enter text to convert to speech using our professional actor voices...">Hello! This is a demonstration of our advanced voice cloning technology. Choose any of our professional actor voices to bring your text to life with realistic, natural-sounding speech.</textarea>
                    
                    <div class="demo-controls">
                        <div class="voice-search-container" id="voiceSearchContainer">
                            <input type="text" 
                                   id="voiceSearchInput" 
                                   class="voice-search-input" 
                                   placeholder="Select a voice..." 
                                   readonly>
                            <div class="voice-dropdown" id="voiceDropdown"></div>
                        </div>
                        <button id="generateSpeech" class="generate-btn">Generate Speech</button>
                    </div>

                    <div id="audioOutput" style="margin-top: 2rem; display: none;">
                        <audio controls style="width: 100%;"></audio>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        const voices = [
            {
                title: "Shakespearean Actor",
                script: "To be or not to be, that is the question! Whether 'tis nobler in the mind to suffer the slings and arrows of outrageous fortune...",
                file: "shakespearean_actor.mp3"
            },
            {
                title: "Action Hero",
                script: "I'll be back. And when I return, there's gonna be hell to pay. Nobody messes with my family and gets away with it!",
                file: "action_hero.mp3"
            },
            {
                title: "Mysterious Narrator",
                script: "In the shadows of the night, where secrets whisper and truth hides... one man will discover that reality is far stranger than fiction.",
                file: "mysterious_narrator.mp3"
            },
            {
                title: "Comedy Character",
                script: "Well, that's just fantastic! Another brilliant plan gone completely sideways. What could possibly go wrong next? Don't answer that!",
                file: "comedy_character.mp3"
            },
            {
                title: "Sinister Villain",
                script: "You fools think you can stop me? I've been planning this for years... and now, finally, my moment of triumph has arrived!",
                file: "sinister_villain.mp3"
            },
            {
                title: "News Anchor",
                script: "Good evening, I'm reporting live from downtown where breaking news continues to unfold. We'll have more updates as this story develops.",
                file: "news_anchor.mp3"
            },
            {
                title: "Southern Gentleman",
                script: "Well, I do declare! That's the finest hospitality I've encountered in all my years. Y'all sure know how to treat a gentleman right proper.",
                file: "southern_gentleman.mp3"
            },
            {
                title: "British Aristocrat",
                script: "I say, old chap, that simply won't do at all! One must maintain proper standards, don't you know. Quite improper, really.",
                file: "british_aristocrat.mp3"
            },
            {
                title: "Sci-Fi Robot",
                script: "System analysis complete. Human behavior patterns remain... illogical. Recalibrating social interaction protocols for optimal efficiency.",
                file: "scifi_robot.mp3"
            },
            {
                title: "Fantasy Wizard",
                script: "By the ancient powers that flow through these mystical realms, I summon thee! The magic of ages past shall guide us to victory!",
                file: "fantasy_wizard.mp3"
            }
        ];

        let currentAudio = null;
        let currentButton = null;
        let selectedVoiceData = { value: voices[0].file, text: voices[0].title };
        let voiceOptions = [];

        // Floating animation elements
        function createFloatingElements() {
            const container = document.querySelector('.floating-elements');
            for (let i = 0; i < 20; i++) {
                const element = document.createElement('div');
                element.className = 'floating-element';
                element.style.left = Math.random() * 100 + '%';
                element.style.top = Math.random() * 100 + '%';
                element.style.animationDelay = Math.random() * 6 + 's';
                container.appendChild(element);
            }
        }

        function createVoiceCard(voice, index) {
            return `
                <div class="voice-card">
                    <div class="voice-title">${voice.title}</div>
                    <div class="voice-script">"${voice.script}"</div>
                    <div class="voice-controls">
                        <button class="play-button" onclick="playVoice('${voice.file}', this, ${index})">
                            ▶ Play
                        </button>
                        <button class="use-button" onclick="useVoiceForTTS(${index})">
                            Use for TTS
                        </button>
                    </div>
                </div>
            `;
        }

        function playVoice(filename, button, index) {
            // Stop current audio if playing
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.innerHTML = '▶ Play';
                }
            }

            // If clicking the same button, just stop
            if (currentButton === button) {
                currentAudio = null;
                currentButton = null;
                return;
            }

            // Play new audio
            currentAudio = new Audio(filename);
            currentButton = button;
            
            button.classList.add('playing');
            button.innerHTML = '⏸ Stop';
            
            currentAudio.play();
            
            currentAudio.onended = function() {
                button.classList.remove('playing');
                button.innerHTML = '▶ Play';
                currentAudio = null;
                currentButton = null;
            };
        }

        function stopAll() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.innerHTML = '▶ Play';
                }
                currentAudio = null;
                currentButton = null;
            }
        }

        function playRandom() {
            const randomIndex = Math.floor(Math.random() * voices.length);
            const buttons = document.querySelectorAll('.play-button');
            playVoice(voices[randomIndex].file, buttons[randomIndex], randomIndex);
        }

        function useVoiceForTTS(index) {
            const voice = voices[index];
            selectVoice(voice.file, voice.title, { audioSrc: voice.file });
            document.getElementById('demo').scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize voice search dropdown
        function initializeVoiceSearch() {
            const container = document.getElementById('voiceSearchContainer');
            const input = document.getElementById('voiceSearchInput');
            const dropdown = document.getElementById('voiceDropdown');

            // Set initial value
            input.value = selectedVoiceData.text;

            // Toggle dropdown
            container.addEventListener('click', function(e) {
                e.stopPropagation();
                if (dropdown.style.display === 'block') {
                    dropdown.style.display = 'none';
                    input.readOnly = true;
                } else {
                    dropdown.style.display = 'block';
                    input.readOnly = false;
                    input.focus();
                    renderVoiceOptions();
                }
            });

            // Filter options while typing
            input.addEventListener('input', function() {
                renderVoiceOptions(input.value);
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', function() {
                dropdown.style.display = 'none';
                input.readOnly = true;
                input.value = selectedVoiceData.text;
            });

            // Handle keyboard navigation
            input.addEventListener('keydown', function(e) {
                const options = dropdown.querySelectorAll('.voice-option');
                const highlighted = dropdown.querySelector('.voice-option.highlighted');
                let index = Array.from(options).indexOf(highlighted);

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (highlighted) highlighted.classList.remove('highlighted');
                    index = index < options.length - 1 ? index + 1 : 0;
                    options[index]?.classList.add('highlighted');
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (highlighted) highlighted.classList.remove('highlighted');
                    index = index > 0 ? index - 1 : options.length - 1;
                    options[index]?.classList.add('highlighted');
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (highlighted) {
                        selectVoice(highlighted.dataset.value, highlighted.textContent, highlighted.dataset);
                    }
                }
            });
        }

        function renderVoiceOptions(filter = '') {
            const dropdown = document.getElementById('voiceDropdown');
            const filteredOptions = voiceOptions.filter(option => 
                option.text.toLowerCase().includes(filter.toLowerCase())
            );

            dropdown.innerHTML = filteredOptions.map(option => `
                <div class="voice-option" 
                     data-value="${option.value}" 
                     data-audio-src="${option.audioSrc || ''}">
                    ${option.text}
                </div>
            `).join('');

            // Add click handlers
            dropdown.querySelectorAll('.voice-option').forEach(option => {
                option.addEventListener('click', function() {
                    selectVoice(this.dataset.value, this.textContent, this.dataset);
                });
            });
        }

        function selectVoice(value, text, dataset) {
            selectedVoiceData = { value, text, ...dataset };
            document.getElementById('voiceSearchInput').value = text;
            document.getElementById('voiceDropdown').style.display = 'none';
            document.getElementById('voiceSearchInput').readOnly = true;
        }

        // Populate voice options
        function populateVoiceSelect() {
            voiceOptions = voices.map(voice => ({
                value: voice.file,
                text: voice.title,
                audioSrc: voice.file
            }));

            renderVoiceOptions();
        }

        // TTS Generation
        document.getElementById('generateSpeech').addEventListener('click', async function() {
            const text = document.getElementById('ttsText').value.trim();
            const voiceData = selectedVoiceData;
            
            if (!text) {
                alert('Please enter some text to convert');
                return;
            }

            this.classList.add('loading');
            this.innerHTML = 'Generating... <div class="spinner"></div>';

            try {
                // Use the selected actor voice as voice sample for cloning
                const result = await websim.textToSpeech({
                    text: text,
                    voice_sample: voiceData.audioSrc // Use the actor voice file
                });

                const audioOutput = document.getElementById('audioOutput');
                const ttsAudioElement = audioOutput.querySelector('audio');
                ttsAudioElement.src = result.url;
                audioOutput.style.display = 'block';

            } catch (error) {
                console.error('Error generating speech:', error);
                alert('Error generating speech. Please try again.');
            } finally {
                this.classList.remove('loading');
                this.innerHTML = 'Generate Speech';
            }
        });

        // Smooth scrolling for navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            createFloatingElements();
            populateVoiceSelect();
            initializeVoiceSearch();
            
            // Generate voice cards
            document.getElementById('voicesGrid').innerHTML = voices.map((voice, index) => createVoiceCard(voice, index)).join('');
        });
    </script>
